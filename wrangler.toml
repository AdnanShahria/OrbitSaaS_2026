name = "orbitsaas"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "frontend/dist"

# Single clean R2 Bucket Binding for local and deployment
[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "orbitsaas-images"
preview_bucket_name = "orbitsaas-images-preview"
