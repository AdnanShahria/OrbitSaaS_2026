<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 54" width="320" height="54" fill="none">
  <defs>
    <!-- Light Background Gradient -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FAFAFA" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Light Border Gradient -->
    <linearGradient id="borderGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#E2E8F0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="lightAmbientGlow" cx="15%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradients -->
    <linearGradient id="iconBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06464F" />
      <stop offset="100%" stop-color="#042F35" />
    </linearGradient>

    <linearGradient id="orbitRingLight1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="orbitRingLight2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="dropShadowLight" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.07" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <style>
    .mono-sub-light {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 1.8px;
      fill: #64748B;
      text-transform: uppercase;
    }
    .brand-title-light {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
      fill: #0F172A;
    }
    .brand-accent-light {
      fill: #059669;
    }
  </style>

  <!-- Container Pill -->
  <g filter="url(#dropShadowLight)">
    <!-- Pill Background -->
    <rect x="1.5" y="1.5" width="317" height="51" rx="25.5" fill="url(#bgGradLight)" />
    <!-- Ambient Inner Glow -->
    <rect x="1.5" y="1.5" width="317" height="51" rx="25.5" fill="url(#lightAmbientGlow)" />
    <!-- Pill Border -->
    <rect x="1.5" y="1.5" width="317" height="51" rx="25.5" stroke="url(#borderGradLight)" stroke-width="1.2" />
  </g>

  <!-- Left: Orbit Icon Circle Container -->
  <g transform="translate(10, 8.5)">
    <!-- Circle Icon Backdrop -->
    <circle cx="18.5" cy="18.5" r="18.5" fill="url(#iconBgLight)" stroke="#059669" stroke-opacity="0.25" stroke-width="1" />
    
    <!-- Central Core Sphere -->
    <circle cx="18.5" cy="18.5" r="4.2" fill="#10B981" />
    <circle cx="17.5" cy="17.2" r="1.3" fill="#A7F3D0" opacity="0.8" />

    <!-- Elliptical Orbit Ring 1 (tilted -38deg) -->
    <ellipse cx="18.5" cy="18.5" rx="12.5" ry="4.5" fill="none" stroke="url(#orbitRingLight1)" stroke-width="1.6" transform="rotate(-38 18.5 18.5)" stroke-dasharray="70" stroke-linecap="round" />
    
    <!-- Elliptical Orbit Ring 2 (tilted 38deg) -->
    <ellipse cx="18.5" cy="18.5" rx="12.5" ry="4.5" fill="none" stroke="url(#orbitRingLight2)" stroke-width="1.3" transform="rotate(38 18.5 18.5)" stroke-dasharray="60" stroke-linecap="round" />

    <!-- Orange Planet Satellite Dot -->
    <circle cx="28.5" cy="12.5" r="2.2" fill="#FD9603" />
    <circle cx="29" cy="12" r="0.7" fill="#FFE3B3" />

    <!-- Amber Planet Satellite Dot -->
    <circle cx="9" cy="24.5" r="1.6" fill="#F59E0B" />
  </g>

  <!-- Middle: Written Banner Text -->
  <g transform="translate(56, 0)">
    <!-- Sub-heading: A PRODUCT OF -->
    <text x="0" y="21" class="mono-sub-light">A PRODUCT OF</text>

    <!-- Main Title: OrbitSaaS -->
    <text x="0" y="38" class="brand-title-light">Orbit<tspan class="brand-accent-light">SaaS</tspan></text>
  </g>

  <!-- Subtle Vertical Divider -->
  <line x1="265" y1="16" x2="265" y2="38" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round" />

  <!-- Right: Status Badge & Link Arrow -->
  <g transform="translate(278, 19)">
    <!-- Live Dot -->
    <circle cx="5" cy="8" r="3.2" fill="#059669" />
    <circle cx="5" cy="8" r="5.5" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="0.8" />

    <!-- Slanted Link Arrow -->
    <path d="M19 4L27 4M27 4L27 12M27 4L16 15" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

