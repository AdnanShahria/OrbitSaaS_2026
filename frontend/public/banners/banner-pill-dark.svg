<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 54" width="320" height="54" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081018" />
      <stop offset="50%" stop-color="#0B1622" />
      <stop offset="100%" stop-color="#051016" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#34D399" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.4" />
    </linearGradient>

    <!-- Radial Emerald Ambient Glow -->
    <radialGradient id="emeraldGlow" cx="20%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Icon Gradients -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A3C44" />
      <stop offset="100%" stop-color="#042227" />
    </linearGradient>

    <linearGradient id="orbitRing1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="orbitRing2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6" />
    </linearGradient>

    <filter id="dropShadowDark" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#10B981" flood-opacity="0.15" />
    </filter>

    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#10B981" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .mono-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 1.8px;
      fill: #94A3B8;
      text-transform: uppercase;
    }
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
      fill: #FFFFFF;
    }
    .brand-accent {
      fill: #34D399;
    }
    .arrow-icon {
      stroke: #64748B;
      transition: stroke 0.2s ease;
    }
  </style>

  <!-- Container Pill -->
  <g filter="url(#dropShadowDark)">
    <!-- Pill Background -->
    <rect x="1.5" y="1.5" width="317" height="51" rx="25.5" fill="url(#bgGradDark)" />
    <!-- Ambient Inner Glow -->
    <rect x="1.5" y="1.5" width="317" height="51" rx="25.5" fill="url(#emeraldGlow)" />
    <!-- Pill Border -->
    <rect x="1.5" y="1.5" width="317" height="51" rx="25.5" stroke="url(#borderGradDark)" stroke-width="1.2" />
  </g>

  <!-- Left: Orbit Icon Circle Container -->
  <g transform="translate(10, 8.5)">
    <!-- Circle Icon Backdrop -->
    <circle cx="18.5" cy="18.5" r="18.5" fill="url(#iconBgGrad)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    
    <!-- Central Core Sphere -->
    <circle cx="18.5" cy="18.5" r="4.2" fill="#10B981" />
    <circle cx="17.5" cy="17.2" r="1.3" fill="#A7F3D0" opacity="0.8" />

    <!-- Elliptical Orbit Ring 1 (tilted -38deg) -->
    <ellipse cx="18.5" cy="18.5" rx="12.5" ry="4.5" fill="none" stroke="url(#orbitRing1)" stroke-width="1.6" transform="rotate(-38 18.5 18.5)" stroke-dasharray="70" stroke-linecap="round" />
    
    <!-- Elliptical Orbit Ring 2 (tilted 38deg) -->
    <ellipse cx="18.5" cy="18.5" rx="12.5" ry="4.5" fill="none" stroke="url(#orbitRing2)" stroke-width="1.3" transform="rotate(38 18.5 18.5)" stroke-dasharray="60" stroke-linecap="round" />

    <!-- Orange Planet Satellite Dot -->
    <circle cx="28.5" cy="12.5" r="2.2" fill="#FD9603" />
    <circle cx="29" cy="12" r="0.7" fill="#FFE3B3" />

    <!-- Amber Planet Satellite Dot -->
    <circle cx="9" cy="24.5" r="1.6" fill="#F59E0B" />
  </g>

  <!-- Middle: Written Banner Text -->
  <g transform="translate(56, 0)">
    <!-- Sub-heading: A PRODUCT OF -->
    <text x="0" y="21" class="mono-sub">A PRODUCT OF</text>

    <!-- Main Title: OrbitSaaS -->
    <text x="0" y="38" class="brand-title">Orbit<tspan class="brand-accent">SaaS</tspan></text>
  </g>

  <!-- Subtle Vertical Divider -->
  <line x1="265" y1="16" x2="265" y2="38" stroke="#334155" stroke-width="1" stroke-linecap="round" />

  <!-- Right: Live Pulse Dot & External Link Glyph -->
  <g transform="translate(278, 19)">
    <!-- Pulsing Live Dot -->
    <circle cx="5" cy="8" r="3.2" fill="#10B981" filter="url(#dotGlow)" />
    <circle cx="5" cy="8" r="5.5" fill="none" stroke="#10B981" stroke-opacity="0.4" stroke-width="0.8" />

    <!-- Slanted Link Arrow -->
    <path class="arrow-icon" d="M19 4L27 4M27 4L27 12M27 4L16 15" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
