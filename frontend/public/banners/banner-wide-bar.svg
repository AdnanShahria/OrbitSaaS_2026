<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="920" height="80" fill="none">
  <defs>
    <linearGradient id="wideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071017" />
      <stop offset="45%" stop-color="#091822" />
      <stop offset="100%" stop-color="#040B10" />
    </linearGradient>

    <linearGradient id="wideBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7" />
      <stop offset="25%" stop-color="#34D399" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="wideGlowLeft" cx="10%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="wideGlowRight" cx="90%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="wideShadow" x="-5%" y="-15%" width="110%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .w-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #10B981;
      text-transform: uppercase;
    }
    .w-brand {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #FFFFFF;
    }
    .w-tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 400;
      fill: #94A3B8;
    }
    .w-cta-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #FFFFFF;
    }
  </style>

  <!-- Base Card -->
  <g filter="url(#wideShadow)">
    <rect x="1" y="1" width="918" height="78" rx="20" fill="url(#wideBg)" />
    <rect x="1" y="1" width="918" height="78" rx="20" fill="url(#wideGlowLeft)" />
    <rect x="1" y="1" width="918" height="78" rx="20" fill="url(#wideGlowRight)" />
    <rect x="1" y="1" width="918" height="78" rx="20" stroke="url(#wideBorder)" stroke-width="1.2" />
  </g>

  <!-- Left: Orbit Logo Icon -->
  <g transform="translate(24, 16)">
    <!-- Container -->
    <circle cx="24" cy="24" r="24" fill="#06464F" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2" />
    
    <!-- Central Sphere -->
    <circle cx="24" cy="24" r="5.5" fill="#10B981" />
    <circle cx="22.5" cy="22" r="1.8" fill="#A7F3D0" opacity="0.8" />

    <!-- Orbital Rings -->
    <ellipse cx="24" cy="24" rx="16" ry="6" fill="none" stroke="#34D399" stroke-width="2" transform="rotate(-38 24 24)" stroke-linecap="round" />
    <ellipse cx="24" cy="24" rx="16" ry="6" fill="none" stroke="#38BDF8" stroke-width="1.6" transform="rotate(38 24 24)" stroke-linecap="round" />

    <!-- Satellites -->
    <circle cx="36" cy="16" r="2.8" fill="#FD9603" />
    <circle cx="12" cy="31" r="2.2" fill="#F59E0B" />
  </g>

  <!-- Left Center: Written Banner Title -->
  <g transform="translate(86, 0)">
    <text x="0" y="32" class="w-sub">A PRODUCT OF</text>
    <text x="0" y="56" class="w-brand">Orbit<tspan fill="#34D399">SaaS</tspan></text>
  </g>

  <!-- Middle Divider -->
  <line x1="260" y1="22" x2="260" y2="58" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" />

  <!-- Middle: Description Tagline -->
  <g transform="translate(285, 0)">
    <text x="0" y="36" class="w-tagline" font-weight="600" fill="#E2E8F0">Custom Web Applications &bull; AI Chatbots &bull; Agentic AI Solutions</text>
    <text x="0" y="55" class="w-tagline" fill="#64748B">Delivering high-performance digital platforms across the globe.</text>
  </g>

  <!-- Right: CTA Button -->
  <g transform="translate(735, 21)">
    <!-- Pill button -->
    <rect x="0" y="0" width="160" height="38" rx="19" fill="url(#ctaBg)" />
    <!-- Ambient shine -->
    <rect x="1" y="1" width="158" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.12" />
    <!-- Text -->
    <text x="24" y="24" class="w-cta-text">orbitsaas.cloud</text>
    <!-- Arrow -->
    <path d="M125 15L133 15M133 15L133 23M133 15L124 24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
