<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 40" width="230" height="40" fill="none">
  <defs>
    <linearGradient id="compactBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B131B" />
      <stop offset="100%" stop-color="#040D14" />
    </linearGradient>
    <linearGradient id="compactBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="compactRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <style>
    .compact-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      fill: #94A3B8;
    }
    .compact-brand {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 800;
      fill: #FFFFFF;
    }
    .compact-accent {
      fill: #34D399;
    }
  </style>

  <!-- Background Pill -->
  <rect x="0.75" y="0.75" width="228.5" height="38.5" rx="19.25" fill="url(#compactBg)" stroke="url(#compactBorder)" stroke-width="1.2" />

  <!-- Left: Mini Orbit Mark -->
  <g transform="translate(8, 7.5)">
    <circle cx="12.5" cy="12.5" r="12.5" fill="#06464F" stroke="#10B981" stroke-opacity="0.3" stroke-width="0.8" />
    <circle cx="12.5" cy="12.5" r="2.8" fill="#10B981" />
    <ellipse cx="12.5" cy="12.5" rx="8.5" ry="3.2" fill="none" stroke="url(#compactRing)" stroke-width="1.2" transform="rotate(-35 12.5 12.5)" />
    <ellipse cx="12.5" cy="12.5" rx="8.5" ry="3.2" fill="none" stroke="#38BDF8" stroke-width="1" transform="rotate(35 12.5 12.5)" />
    <circle cx="19" cy="8.5" r="1.5" fill="#FD9603" />
  </g>

  <!-- Text -->
  <text x="42" y="24.5" class="compact-text">A product of <tspan class="compact-brand">Orbit<tspan class="compact-accent">SaaS</tspan></tspan></text>

  <!-- Link Arrow -->
  <path d="M208 17L214 17M214 17L214 23M214 17L206 25" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
